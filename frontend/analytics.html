<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Progress — EduBridge AI</title>
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/dashboard.css" />
<link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>

<div class="topbar">
  <span class="topbar-logo">EduBridge AI</span>
  <button class="topbar-toggle" aria-label="Open menu">☰</button>
</div>

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-logo">Edu<span>Bridge</span></div>
    <nav class="sidebar-nav">
      <a href="/student-dashboard.html" class="sidebar-link">📊 Dashboard</a>
      <a href="/doubt-solver.html" class="sidebar-link">💬 Ask AI</a>
      <a href="/practice.html" class="sidebar-link">📝 Practice</a>
      <a href="/analytics.html" class="sidebar-link active">📈 Progress</a>
      <a href="/student-dashboard.html#recommendations" class="sidebar-link">🎯 Recommendations</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-avatar" id="sidebar-avatar">S</div>
        <div>
          <div class="sidebar-user-name" id="sidebar-user-name">Student</div>
          <div class="sidebar-user-role" id="sidebar-user-role">Student</div>
        </div>
      </div>
      <a href="#" id="logout-btn" class="sidebar-link mt-4">🚪 Log Out</a>
    </div>
  </aside>

  <main class="main-content">
    <div class="section-header">
      <h2 class="mb-0">Your Progress</h2>
    </div>

    <div class="stat-grid" style="grid-template-columns: repeat(2, 1fr);">
      <div class="card">
        <h4>Subject Mastery</h4>
        <canvas id="subject-chart" height="220"></canvas>
      </div>
      <div class="card">
        <h4>Weekly Learning Activity</h4>
        <canvas id="weekly-chart" height="220"></canvas>
      </div>
    </div>

    <div class="card mt-6">
      <h4>Topic Performance</h4>
      <canvas id="topic-chart" height="140"></canvas>
    </div>

    <div class="stat-grid mt-6" style="grid-template-columns: repeat(1, 1fr);">
      <div class="stat-card">
        <div class="stat-label">Overall Quiz Accuracy</div>
        <div class="stat-value" id="quiz-accuracy-value">--%</div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/analytics.js"></script>
</body>
</html>
