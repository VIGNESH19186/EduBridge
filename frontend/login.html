<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In — EduBridge AI</title>
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>

<div class="auth-shell">
  <div class="auth-card card">
    <div class="auth-logo">
      <div class="nav-logo">Edu<span>Bridge</span> AI</div>
      <p class="text-sm mt-2">Welcome back. Continue your learning journey.</p>
    </div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="you@example.com" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="••••••••" />
      </div>
      <button type="submit" class="btn btn-accent btn-block">Sign In</button>
    </form>

    <p class="text-sm mt-4" style="text-align:center;">
      Don't have an account? <a href="/register.html">Create one</a>
    </p>

    <div class="card-flat mt-4" style="background:var(--paper-100);">
      <p class="text-sm mb-0"><strong>Demo accounts</strong> (password: <span class="font-mono">password123</span>)</p>
      <p class="text-sm mb-0 mt-2">Student: <span class="font-mono">student@example.com</span></p>
      <p class="text-sm mb-0">Teacher: <span class="font-mono">teacher@example.com</span></p>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
