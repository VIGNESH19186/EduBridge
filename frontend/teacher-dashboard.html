<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Teacher Dashboard — EduBridge AI</title>
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/dashboard.css" />
<link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>

<div class="topbar">
  <span class="topbar-logo">EduBridge AI</span>
  <button class="topbar-toggle" aria-label="Open menu">☰</button>
</div>

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-logo">Edu<span>Bridge</span></div>
    <nav class="sidebar-nav">
      <a href="/teacher-dashboard.html" class="sidebar-link active">📊 Dashboard</a>
      <a href="/teacher-dashboard.html#insights" class="sidebar-link">🚨 Student Insights</a>
      <a href="/knowledge-base.html" class="sidebar-link">📚 Knowledge Base</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-avatar" id="sidebar-avatar">T</div>
        <div>
          <div class="sidebar-user-name" id="sidebar-user-name">Teacher</div>
          <div class="sidebar-user-role" id="sidebar-user-role">Teacher</div>
        </div>
      </div>
      <a href="#" id="logout-btn" class="sidebar-link mt-4">🚪 Log Out</a>
    </div>
  </aside>

  <main class="main-content">
    <div class="section-header">
      <h2 class="mb-0">Teacher Dashboard</h2>
    </div>

    <div id="stats-loading" class="stat-grid">
      <div class="skeleton" style="height:100px;"></div>
      <div class="skeleton" style="height:100px;"></div>
      <div class="skeleton" style="height:100px;"></div>
      <div class="skeleton" style="height:100px;"></div>
    </div>
    <div id="stats-grid" class="stat-grid hidden"></div>

    <section class="mt-6" id="insights">
      <div class="section-header">
        <h3 class="mb-0">Students Needing Attention</h3>
      </div>
      <div id="insights-loading">
        <div class="skeleton" style="height:90px; margin-bottom:12px;"></div>
        <div class="skeleton" style="height:90px; margin-bottom:12px;"></div>
      </div>
      <div id="insights-list" class="hidden"></div>
    </section>

    <section class="mt-6">
      <div class="section-header">
        <h3 class="mb-0">Class Roster</h3>
      </div>
      <div id="roster-loading" class="card">
        <div class="skeleton" style="height:20px; margin-bottom:14px;"></div>
        <div class="skeleton" style="height:20px;"></div>
      </div>
      <div id="roster-table" class="card hidden" style="overflow-x:auto;"></div>
    </section>
  </main>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/teacher-dashboard.js"></script>
</body>
</html>
